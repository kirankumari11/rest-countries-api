<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REST Countries API with color theme switcher</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,300,regular,500,600,700,800,900" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./country.css">
    <script src="./theme.js" defer></script>
    <script src="./country.js" defer></script>
</head>

<body>
    <header>
        <div class="header-content">
            <h2 class="title"><a href="./index.html">Where in the world?</a></h2>
            <p class="theme-changer"> <i class="fa-regular fa-moon"></i> Dark mode</p>
        </div>
    </header>

    <main>
        <div class="countries-details-container">
            <a href="./index.html" class="back-btn"> <i class="fa-solid fa-arrow-left"></i>&nbsp;&nbsp; Back</a>
            <div class="country-details">
                <img src="" alt="flag image">
                <div class="details-text-container">
                    <h1></h1>
                    <div class="details-text">
                        <p><b>Native Name: </b><span class="native-name"></span></p>
                        <p><b>Population: </b><span class="population"></span></p>
                        <p><b>Region: </b><span class="region"></span></p>
                        <p><b>Sub Region: </b><span class="sub-region"></span></p>
                        <p><b>Capital: </b><span class="capital"></span></p>

                        <p><b>Top Level Domain: </b><span class="tld"></span></p>
                        <p><b>Curriences: </b><span class="currency"></span></p>

                    </div>

                    <div class="border-countries">
                        <div class="border-countries-name">
                            <b>Border Countries :</b>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>
</body>

</html>
